name: ai_image_classifier_example
description: "Example app for ai_image_classifier package."
publish_to: 'none'

environment:
  sdk: ">=3.10.4 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  ai_image_classifier:
    path: ../
  image_picker: ^1.2.2
  camera: ^0.12.0+1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/mobilenet_v1.tflite
    - assets/models/labels.txt
